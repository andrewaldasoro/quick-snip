name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # The macOS 27 SDK (SwiftUI macro plugins) ships only with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-xcode-27.0-${{ hashFiles('Package.resolved') }}

      # A new changelog version must follow the latest tag; notes under Unreleased would never ship.
      - name: Release version
        run: |
          version="$(./scripts/next-release.sh)"
          echo "Merging releases: ${version:-nothing}" >> "$GITHUB_STEP_SUMMARY"

      - name: Quality gate
        run: ./scripts/check.sh --bundle

      # Same packaging as release.yml, so a broken release is caught before tagging.
      - name: Package (dry run)
        env:
          VERSION: 0.0.0
        run: ./scripts/test-package.sh
