name: Release

# Every merge to main whose CHANGELOG.md has a new `## [x.y.z]` section publishes that version:
# a vx.y.z tag and GitHub Release with the zip, DMG, checksums and build-provenance
# attestations (our free stand-in for notarization), then the Sparkle appcast and landing page
# on GitHub Pages. Merges without one release nothing. Pushing a v* tag by hand also releases.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: next
        # Empty when the newest changelog version is already tagged: nothing to release.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(./scripts/next-release.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: ${version:-none}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # package.sh rejects anything that isn't x.y.z.
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes
        # Fails fast when CHANGELOG.md has no section for this version.
        run: ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Quality gate
        run: ./scripts/check.sh --bundle

      - name: Package
        env:
          # Grows with every run of this workflow; Sparkle compares CFBundleVersion.
          BUILD: ${{ github.run_number }}
        run: ./scripts/test-package.sh

      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/QuickSnip.zip
            dist/QuickSnip.dmg
            dist/QuickSnip.sbom.cdx.json

      # Creates the tag on the merged commit (or uses the one pushed by hand). A tag made with
      # this workflow's token doesn't start another run, so nothing releases twice.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            dist/QuickSnip.dmg dist/QuickSnip.zip dist/QuickSnip.sbom.cdx.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "QuickSnip $VERSION"

  # After the release, so the appcast never points at assets that don't exist yet.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
