name: Release

# Push a tag like v1.2.3 to publish a GitHub Release with the zip, DMG, checksums and
# build-provenance attestations (our free stand-in for notarization), then the Sparkle
# appcast and landing page on GitHub Pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        # package.sh rejects anything that isn't x.y.z.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Release notes
        # Fails fast when CHANGELOG.md has no section for this version.
        run: ./scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Quality gate
        run: ./scripts/check.sh --bundle

      - name: Package
        env:
          # Grows with every run of this workflow; Sparkle compares CFBundleVersion.
          BUILD: ${{ github.run_number }}
        run: ./scripts/test-package.sh

      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/QuickSnip.zip
            dist/QuickSnip.dmg
            dist/QuickSnip.sbom.cdx.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/QuickSnip.dmg dist/QuickSnip.zip dist/QuickSnip.sbom.cdx.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "QuickSnip $VERSION"

  # After the release, so the appcast never points at assets that don't exist yet.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
